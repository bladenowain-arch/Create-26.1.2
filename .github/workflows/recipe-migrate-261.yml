name: Recipe migration 26.1

on:
  push:
    branches: [port/26.1.2]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: port/26.1.2
          fetch-depth: 0
      - name: Migrate standard recipe generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/com/simibubi/create/foundation/data/recipe/CreateStandardRecipeGen.java')
          s=p.read_text()
          s=s.replace('RecipeCategory.MISC, isOtherMod ? Items.DIRT : result.get(), exp,\n\t\t\t\t\t\t(int) (cookingTime * cookingTimeModifier), serializer, factory)', 'RecipeCategory.MISC, isOtherMod ? Items.DIRT : result.get(), exp,\n\t\t\t\t\t\t(int) (cookingTime * cookingTimeModifier), CraftingBookCategory.MISC, factory)')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/simibubi/create/foundation/data/recipe/CreateStandardRecipeGen.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'port: update cooking recipe builder for 26.1'
          git push origin HEAD:port/26.1.2
